name: Update team calendars

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install HTTP client
        run: python3 -m pip install --disable-pip-version-check --no-input curl_cffi
      - name: Generate all 12 calendars
        run: python3 scripts/update_team_calendars.py
      - name: Commit calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.ics
          git diff --cached --quiet || git commit -m "Update team calendars"
          git push
